services:
  - type: web
    name: secure-data-portal-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: DB_NAME
        value: computersecurity
      - key: SECRET_KEY
        sync: false
      - key: PEPPER
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
